<!DOCTYPE html>
<html>
  <head>
    <title>MCA CAR RENTAL</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; background: #f8f9fa; }
      h1 { text-align: center; color: #007BFF; }
      p { text-align: center; font-size: 16px; }
      label { display: block; margin-top: 10px; font-weight: bold; }
      input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
      button { margin-top: 15px; padding: 12px; width: 100%; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
      button:hover { background: #0056b3; }
      #response { text-align: center; margin-top: 20px; font-weight: bold; color: green; }
    </style>
  </head>
  <body>
    <h1>MCA CAR RENTAL</h1>
    <p><b>Available Car:</b> Mitsubishi Mirage G4</p>

    <form id="bookingForm">
      <label>Full Name</label>
      <input type="text" id="name" required>
      
      <label>Contact Number</label>
      <input type="text" id="contact" required>

      <label>Delivery or Pickup</label>
      <select id="option" required>
        <option value="Delivery">Delivery</option>
        <option value="Pickup">Pickup</option>
      </select>
      
      <label>Start Date & Time</label>
      <input type="datetime-local" id="start" required>
      
      <label>End Date & Time</label>
      <input type="datetime-local" id="end" required>
      
      <button type="submit">Book Now</button>
    </form>

    <p id="response"></p>

    <script>
      document.getElementById("bookingForm").addEventListener("submit", function(e) {
        e.preventDefault();
        fetch("https://script.google.com/macros/s/AKfycbwwIua2HW_MPpnyfw22scyhQuw23Pl4lZWHbq5vUjxxAn7n6XVgfvlrCOdwdfX8RW_M/exec", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value,
            contact: document.getElementById("contact").value,
            option: document.getElementById("option").value,
            start: document.getElementById("start").value,
            end: document.getElementById("end").value
          })
        }).then(res => res.text()).then(msg => {
          document.getElementById("response").innerText = msg;
          document.getElementById("bookingForm").reset();
        });
      });
    </script>
  </body>
</html>
