<form id="bookingForm">
  <div>
    <label for="full_name">Full Name:</label>
    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
  </div>
  <div>
    <label for="contact">Contact Number:</label>
    <input type="text" id="contact" name="contact" placeholder="Enter contact number" required>
  </div>
  <div>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
  </div>
  <div>
    <label for="start_date">Start Date:</label>
    <input type="date" id="start_date" name="start_date" required>
  </div>
  <div>
    <label for="start_time">Start Time:</label>
    <input type="time" id="start_time" name="start_time" required>
  </div>
  <div>
    <label for="end_date">End Date:</label>
    <input type="date" id="end_date" name="end_date" required>
  </div>
  <div>
    <label for="end_time">End Time:</label>
    <input type="time" id="end_time" name="end_time" required>
  </div>
  <button type="submit">Confirm Booking</button>
</form>

<p id="responseMessage" style="text-align:center; margin-top:20px; font-weight:bold; color:green;"></p>

<script>
  const form = document.getElementById("bookingForm");
  const responseMessage = document.getElementById("responseMessage");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    fetch("https://script.google.com/macros/s/AKfycbys5QIzmv1OOezOD4g8kVGLfDXiC1IGVV1ggY0swXF-SFhPuyoaXAcdtYa9brvBzgNA/exec", {
      method: "POST",
      body: new FormData(form)
    })
    .then(res => res.text())
    .then(data => {
      responseMessage.innerText = "✅ Booking Successful! We’ll contact you soon.";
      form.reset();
    })
    .catch(err => {
      responseMessage.innerText = "❌ Something went wrong. Please try again.";
    });
  });
</script>
